<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ريموت أبو ناصر - LGMAX</title>
    <link rel="icon" href="abu_nasser_icon.jpg" type="image/jpeg">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .header {
            margin-bottom: 15px;
        }
        .app-icon {
            width: 80px;
            height: 80px;
            margin-top: 10px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #00adb5;
            box-shadow: 0 0 10px rgba(0, 173, 181, 0.5);
        }
        h2 {
            color: #00adb5;
            margin: 10px 0 5px 0;
            font-size: 24px;
        }
        .user-name {
            color: #f0ad4e;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .ip-container {
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
            max-width: 320px;
            margin: 0 auto 15px auto;
            border: 1px solid #333;
        }
        .ip-container label {
            font-size: 13px;
            color: #aaa;
            display: block;
            margin-bottom: 5px;
        }
        .ip-input {
            width: 80%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #00adb5;
            background-color: #2b2b2b;
            color: #fff;
            text-align: center;
            font-size: 15px;
        }
        .btn {
            display: block;
            width: 90%;
            max-width: 320px;
            margin: 12px auto;
            padding: 15px;
            font-size: 17px;
            font-weight: bold;
            background-color: #393e46;
            color: #eeeeee;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .btn:active {
            background-color: #00adb5;
            transform: scale(0.98);
        }
        .btn-connect {
            background-color: #f0ad4e;
            color: #121212;
            font-size: 15px;
            padding: 10px;
        }
        .btn-wallpaper {
            background-color: #0275d8;
            color: #ffffff;
        }
        .btn-voice {
            background-color: #ff9800;
            color: #ffffff;
        }
        .btn-danger {
            background-color: #d9534f;
        }
        #status {
            margin-top: 15px;
            color: #00adb5;
            font-size: 14px;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="abu_nasser_icon.jpg" alt="أيقونة أبو ناصر" class="app-icon">
        <h2>ريموت شاشة LGMAX</h2>
        <div class="user-name">👑 تطبيق أبو ناصر</div>
        
        <div class="ip-container">
            <label for="ipAddress">عنوان IP الخاص بالشاشة:</label>
            <input type="text" id="ipAddress" class="ip-input" value="192.168.1.101" onchange="saveIP(this.value)">
            <button class="btn btn-connect" onclick="connectTV()" style="margin-top:10px; width:100%;">🔗 اتصال وتفعيل الشاشة</button>
        </div>
    </div>

    <button class="btn" onclick="sendCommand('home')">🏠 الرئيسية (Home)</button>
    <button class="btn" onclick="sendCommand('back')">↩️ رجوع (Back)</button>
    <button class="btn" onclick="sendCommand('vol_up')">🔊 رفع الصوت (+)</button>
    <button class="btn" onclick="sendCommand('vol_down')">🔉 خفض الصوت (-)</button>
    <button class="btn btn-voice" onclick="startVoiceSearch()">🎤 بحث صوتي</button>
    
    <label for="wallpaperInput" class="btn btn-wallpaper">🖼️ تغيير خلفية الشاشة</label>
    <input type="file" id="wallpaperInput" accept="image/*" onchange="uploadWallpaper(this)">

    <button class="btn btn-danger" onclick="sendCommand('uninstall')">🗑️ إدارة / حذف التطبيقات</button>

    <div id="status"></div>

    <script>
        window.onload = function() {
            const savedIP = localStorage.getItem('tv_ip');
            if (savedIP) {
                document.getElementById('ipAddress').value = savedIP;
            }
        };

        function getIP() {
            return document.getElementById('ipAddress').value.trim();
        }

        function saveIP(ip) {
            localStorage.setItem('tv_ip', ip.trim());
            document.getElementById('status').innerText = '✅ تم حفظ عنوان الـ IP الجديد';
        }

        // دالة الاتصال المباشر باستخدام المنفذ الصحيح 8888 والرابط الفعلي للشاشة
        function connectTV() {
            const ip = getIP();
            const url = 'http://phapp.tv.selenview.com/download?action=connect&ip=' + ip + '&port=8888&web_port=44445&account_id=&mac=14:2a:14:45:fa:60&ctime=1793008706&csign=';
            document.getElementById('status').innerText = '🌐 جاري ربط التطبيق بالشاشة...';
            window.open(url, '_blank');
        }

        function sendCommand(cmd) {
            const ip = getIP();
            const url = 'http://' + ip + ':8888/' + cmd;
            
            document.getElementById('status').innerText = '⏳ جاري إرسال الأمر...';

            const img = new Image();
            img.src = url + '?t=' + new Date().getTime();
            
            img.onload = img.onerror = function() {
                document.getElementById('status').innerText = '✅ تم إرسال الأمر بنجاح!';
            };
            
            setTimeout(() => {
                document.getElementById('status').innerText = '✅ تم التنفيذ';
            }, 500);
        }

        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('متصفحك لا يدعم البحث الصوتي');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.interimResults = false;

            document.getElementById('status').innerText = '🎙️ جاري الاستماع... تحدث الآن';

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                document.getElementById('status').innerText = 'النص: ' + text;
                sendCommand('search?q=' + encodeURIComponent(text));
            };

            recognition.onerror = function() {
                document.getElementById('status').innerText = '❌ حدث خطأ في التقاط الصوت';
            };

            recognition.start();
        }

        function uploadWallpaper(input) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                document.getElementById('status').innerText = '🖼️ جاري إرسال الخلفية...';

                const formData = new FormData();
                formData.append('wallpaper', file);

                const ip = getIP();
                fetch('http://' + ip + ':8888/set_wallpaper', {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors'
                })
                .then(() => {
                    document.getElementById('status').innerText = '✅ تم إرسال الخلفية بنجاح!';
                })
                .catch(() => {
                    document.getElementById('status').innerText = '❌ تأكد من اتصال الواي فاي والشاشة';
                });
            }
        }
    </script>
</body>
</html>
